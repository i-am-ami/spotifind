<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpotiFind</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Handlee&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --peach: #FFDACA;
      --blush: #FFBDBA;
      --soft-pink: #FFA0AB;
      --pink: #FF829B;
      --sage: #7D8B67;
      --sage-dark: #657253;
      --cream: #FFF8F4;
      --white: #FFFFFF;
      --text: #2F3529;
      --muted: #6F7667;
      --line: rgba(125, 139, 103, 0.2);
      --shadow: 0 12px 30px rgba(79, 73, 62, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", sans-serif;
      color: var(--sage-dark);
      background:
        radial-gradient(circle at top right, rgba(255, 160, 171, 0.15), transparent 30%),
        linear-gradient(135deg, var(--cream), #fff 55%, rgba(255, 218, 202, 0.5));
    }

    button,
    input,
    select {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: block;
    }

    .sidebar {
      min-height: 100vh;
      padding: 34px 22px 28px;
      background: linear-gradient(180deg, var(--blush), #ffd5d4 55%, #ffc8cc);
      border-right: 1px solid rgba(255,255,255,0.5);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      padding: 10px 18px 24px;
    }

    .brand-title {
      margin: 0;
      text-align: center;
      font-family: "Handlee", cursive;
      font-size: 2.65rem;
      color: var(--sage);
      letter-spacing: 0.02em;
    }

    .brand-divider {
    margin: 12px 0 0;
    text-align: center;
    color: var(--sage);   /* Sage green */
    font-size: 1.2rem;
    letter-spacing: 10px;
    user-select: none;
}

    .brand-subtitle {
      margin: 8px 0 0 18px;
      font-family: "Handlee", cursive;
      color: var(--sage);
      font-size: 1.12rem;
      line-height: 1.5;
    }

    .nav {
      margin-top: 26px;
      display: grid;
      gap: 10px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: var(--sage);
      cursor: pointer;
      font-family: "Handlee", cursive;
      font-size: 1.22rem;
      text-align: left;
      transition: 0.2s ease;
    }

    .nav-item:hover,
    .nav-item.active {
      background: rgba(255,255,255,0.8);
      box-shadow: 0 8px 20px rgba(113, 85, 78, 0.08);
    }

    .nav-item.active {
      color: var(--pink);
    }

    .nav-icon {
      width: 24px;
      text-align: center;
      font-size: 1.15rem;
    }

    .now-playing {
      padding: 18px;
      border-radius: 20px;
      background: rgba(255,255,255,0.68);
      border: 1px solid rgba(255,255,255,0.75);
      box-shadow: var(--shadow);
    }

    .now-playing-label {
      color: var(--sage);
      font-family: "Handlee", cursive;
      margin-bottom: 13px;
    }

    .track-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .mini-cover {
      width: 70px;
      height: 70px;
      border-radius: 14px;
      background:
        linear-gradient(rgba(255,130,155,.14), rgba(125,139,103,.18)),
        linear-gradient(145deg, var(--soft-pink), var(--sage));
      display: grid;
      place-items: center;
      color: white;
      font-size: 1.4rem;
    }

    .track-title {
      font-family: "Handlee", cursive;
      font-size: 1.15rem;
      margin-bottom: 4px;
    }

    .track-artist {
      color: var(--sage);
      font-size: 0.9rem;
    }

    .progress {
      margin: 18px 0 10px;
      height: 5px;
      border-radius: 999px;
      background: rgba(125,139,103,0.2);
      overflow: hidden;
    }

    .progress span {
      display: block;
      width: 34%;
      height: 100%;
      background: var(--sage);
    }

    .time-row,
    .player-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .time-row {
      font-size: 0.78rem;
      color: var(--sage);
    }

    .player-controls {
      margin-top: 12px;
      color: var(--sage);
      font-size: 1.1rem;
    }

    .main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 42px clamp(24px, 6vw, 90px) 56px;
    }

    .hero {
      text-align: center;
      margin: 0 auto 26px;
      max-width: 980px;
    }

    .hero h1 {
      margin: 0;
      color: var(--pink);
      font-family: "Handlee", cursive;
      font-size: clamp(3rem, 6vw, 5.8rem);
      font-weight: 400;
      line-height: 1;
    }

    .hero p {
      max-width: 760px;
      margin: 18px auto 0;
      font-family: "Handlee", cursive;
      font-size: 1.35rem;
      line-height: 1.55;
      color: var(--sage-dark);
    }


    .hero-divider {
      margin: 14px 0 0;
      color: var(--pink);
      font-size: 1.1rem;
      letter-spacing: 8px;
      user-select: none;
    }

    .search-wrap {
      max-width: 1040px;
      margin: 28px auto 0;
    }

    .search-bar {
      display: flex;
      gap: 14px;
      align-items: center;
      padding: 16px;
      border-radius: 18px;
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .search-icon {
      color: var(--pink);
      font-size: 1.7rem;
      padding-left: 8px;
    }

    .search-bar input {
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      padding: 12px 6px;
      font-family: "Handlee", cursive;
      font-size: 1.5rem;
      color: var(--sage-dark);
    }

    .clear-btn {
      border: 0;
      background: transparent;
      color: var(--sage-dark);
      font-size: 1.4rem;
      cursor: pointer;

      display: none; /* Hidden by default */
    }

    .search-btn {
      border: 0;
      border-radius: 14px;
      padding: 15px 28px;
      background: var(--pink);
      color: white;
      cursor: pointer;
      font-family: "Handlee", cursive;
      font-size: 1.25rem;
      box-shadow: 0 10px 20px rgba(125,139,103,0.25);
      transition: 0.2s ease;
    }

    .search-btn:hover {
      background: var(--soft-pink);
      transform: translateY(-1px);
    }

    .quick-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 24px;
      color: var(--sage-dark);
      font-family: "Handlee", cursive;
      font-size: 1.1rem;
    }

    .chip {
      border: 0;
      border-radius: 999px;
      background: rgba(255,189,186,0.48);
      color: #e95476;
      padding: 9px 16px;
      cursor: pointer;
      font-family: "Handlee", cursive;
      font-size: 1rem;
      transition: 0.18s ease;
    }

    .chip:hover {
      background: var(--blush);
      transform: translateY(-1px);
    }

    .results-area {
      max-width: 1040px;
      margin: 30px auto 0;
    }

    .results-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      margin-bottom: 14px;
    }

    .count {
      color: var(--pink);
      font-family: "Handlee", cursive;
      font-size: 1.12rem;
    }

    .sort-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--sage-dark);
      font-family: "Handlee", cursive;
    }

    select {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 36px 10px 14px;
      background: white;
      color: var(--sage-dark);
      outline: 0;
    }

    .results {
      display: grid;
      gap: 12px;
    }

    .song-card {
      display: grid;
      grid-template-columns: 92px 1.1fr 1.7fr auto auto;
      align-items: center;
      gap: 20px;
      padding: 12px 18px;
      border-radius: 18px;
      background: rgba(255,255,255,0.88);
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: var(--shadow);
      transition: 0.2s ease;
    }

    .song-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(79, 73, 62, 0.15);
    }

    .cover {
      width: 82px;
      height: 82px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      font-size: 2rem;
      color: white;
      background: linear-gradient(145deg, var(--soft-pink), var(--sage));
    }

    .song-title {
      margin: 0;
      font-family: "Handlee", cursive;
      font-size: 1.35rem;
    }

    .artist {
      margin: 5px 0 0;
      color: var(--sage-dark);
      font-size: 0.98rem;
    }

    .lyric {
      margin: 0;
      font-family: "Handlee", cursive;
      font-size: 1.08rem;
      line-height: 1.45;
    }

    mark {
      background: rgba(255,130,155,0.28);
      color: #e94f72;
      border-radius: 4px;
      padding: 0 3px;
    }

    .duration {
      color: var(--sage-dark);
      font-family: "Handlee", cursive;
    }

    .play-btn {
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 50%;
      background: var(--pink);
      color: white;
      cursor: pointer;
      font-size: 1.1rem;
      transition: 0.18s ease;
    }

    .play-btn:hover {
      background: var(--soft-pink);
      transform: scale(1.05);
    }

    .empty {
      padding: 50px 24px;
      text-align: center;
      border-radius: 18px;
      background: rgba(255,255,255,0.78);
      color: var(--sage);
      border: 1px dashed var(--line);
      font-family: "Handlee", cursive;
      font-size: 1.15rem;
    }

    .footer-note {
      margin-top: 28px;
      text-align: center;
      color: var(--sage-dark);
      font-family: "Handlee", cursive;
      font-size: 1.1rem;
    }

    .playlist-toggle {
    position: relative;
}

.dropdown-arrow {
    margin-left: auto;
    font-size: 1.2rem;
    transition: transform 0.2s ease;
}

.playlist-toggle.open .dropdown-arrow {
    transform: rotate(180deg);
}

.playlist-dropdown {
    display: none;
    margin: 2px 0 8px 38px;
    padding-left: 12px;
    border-left: 2px solid rgba(125, 139, 103, 0.28);
}

.playlist-dropdown.open {
    display: grid;
    gap: 4px;
}

.playlist-option {
    width: 100%;
    border: 0;
    border-radius: 11px;
    padding: 10px 12px;
    background: transparent;
    color: var(--sage);
    font-family: "Handlee", cursive;
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    transition: 0.18s ease;
}

.playlist-option span {
    margin-right: 8px;
}

.playlist-option:hover,
.playlist-option.active {
    background: rgba(255, 255, 255, 0.58);
}

.playlist-option.active {
    font-weight: bold;
}

.selected-playlist {
    margin: 16px 0 0;
    color: var(--sage-dark);
    font-family: "Handlee", cursive;
    font-size: 1.05rem;
}

.selected-playlist strong {
    color: var(--pink);
}


    .scope-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--sage-dark);
      font-family: "Handlee", cursive;
      font-size: 1.12rem;
    }

    .scope-select {
      min-width: 210px;
      padding: 10px 38px 10px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: 0;
      color: var(--sage-dark);
      background: rgba(255,255,255,0.9);
      cursor: pointer;
    }

    .sidebar,
    .sidebar button,
    .sidebar .track-title,
    .sidebar .track-artist,
    .sidebar .time-row {
      color: var(--sage);
    }

    .nav-item.active {
      color: var(--sage-dark);
    }

    input[type="search"]::-webkit-search-cancel-button {
      appearance: none;
      -webkit-appearance: none;
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        min-height: auto;
        height: auto;
        position: static;
        padding: 18px 20px;
        color: var(--sage);
      }

      .brand {
        padding: 0;
      }

      .brand-subtitle,
      .nav,
      .now-playing {
        display: none;
      }

      .brand-title {
        font-size: 2rem;
      }

      .song-card {
        grid-template-columns: 74px 1fr auto;
      }

      .cover {
        width: 68px;
        height: 68px;
      }

      .lyric {
        grid-column: 2 / 4;
      }

      .duration {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .main {
        padding: 28px 16px 36px;
      }

      .search-bar {
        flex-wrap: wrap;
      }

      .search-btn {
        width: 100%;
      }

      .results-top {
        align-items: flex-start;
        flex-direction: column;
      }

      .song-card {
        grid-template-columns: 60px 1fr;
      }

      .cover {
        width: 58px;
        height: 58px;
      }

      .play-btn {
        grid-column: 2;
        justify-self: start;
      }

      .lyric {
        grid-column: 1 / 3;
      }
    }
  </style>
</head>

<body>
  <div class="app">
<main class="main">
      <section class="hero">
        <h1>♡ SpotiFind ♡</h1>
        <div class="hero-divider" aria-hidden="true">✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦ ✧ ✦</div>
        <p>
          Search all of Spotify or choose one of your playlists to find songs
          containing a word or phrase.
        </p>
      </section>

      <section class="search-wrap">
        <label class="scope-row" for="scopeSelect">
          <span>Search in:</span>
          <select class="scope-select" id="scopeSelect">
            <option value="spotify">Spotify</option>
            <option value="liked">♥ Liked Songs</option>
            <option value="main-character">♫ Main Character</option>
            <option value="study">♫ Study Playlist</option>
            <option value="chill">♫ Chill Mix</option>
            <option value="summer">♫ Summer Songs</option>
          </select>
        </label>

        <form id="searchForm" class="search-bar">
          <span class="search-icon">⌕</span>

          <input
            id="searchInput"
            type="search"
            placeholder="Try love, dream, night..."
            value="love"
            autocomplete="off"
          />

          <button id="clearButton" class="clear-btn" type="button" aria-label="Clear search">×</button>
          <button class="search-btn" type="submit">Search</button>
        </form>

      <p class="selected-playlist">
          Searching in:
          <strong id="selectedPlaylist">Spotify</strong>
        </p>
      </section>

      <section class="results-area">
        <div class="results-top">
          <div id="resultCount" class="count">4 songs found</div>

          <label class="sort-wrap">
            Sort by:
            <select id="sortSelect">
              <option value="relevance">Relevance</option>
              <option value="title">Title</option>
              <option value="artist">Artist</option>
            </select>
          </label>
        </div>

        <div id="results" class="results"></div>

        <div class="footer-note">♡ Keep searching. There’s a song for every word. ♡</div>
      </section>
    </main>
  </div>

  <script>
    // Demo data. Your backend will later replace this with Spotify/lyrics results.
    const songs = [
      {
        title: "Love Me Like You Do",
        artist: "Ellie Goulding",
        lyric: "You're the love of my life, you're the air that I breathe...",
        duration: "4:12",
        cover: "♡",
        scopes: ["spotify", "liked", "main-character"]
      },
      {
        title: "All of Me",
        artist: "John Legend",
        lyric: "'Cause all of me loves all of you",
        duration: "4:29",
        cover: "☾",
        scopes: ["spotify", "liked", "chill"]
      },
      {
        title: "Lover",
        artist: "Taylor Swift",
        lyric: "Can I go where you go? Can we always be this close forever?",
        duration: "3:41",
        cover: "🌸",
        scopes: ["spotify", "liked", "main-character"]
      },
      {
        title: "The Night We Met",
        artist: "Lord Huron",
        lyric: "I had all and then most of you, some and now none of you",
        duration: "3:28",
        cover: "☁",
        scopes: ["spotify", "study", "chill"]
      },
      {
        title: "Dreams",
        artist: "Fleetwood Mac",
        lyric: "Thunder only happens when it's raining, players only love you when they're playing",
        duration: "4:17",
        cover: "✦",
        scopes: ["spotify", "summer", "chill"]
      },
      {
        title: "Goodbye",
        artist: "Mimi Webb",
        lyric: "This is goodbye, but I still hear your name in every song",
        duration: "3:02",
        cover: "🌙",
        scopes: ["spotify", "main-character"]
      }
    ];

    const scopeNames = {
      spotify: "Spotify",
      liked: "Liked Songs",
      "main-character": "Main Character",
      study: "Study Playlist",
      chill: "Chill Mix",
      summer: "Summer Songs"
    };

    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const clearButton = document.getElementById("clearButton");
    const results = document.getElementById("results");
    const resultCount = document.getElementById("resultCount");
    const sortSelect = document.getElementById("sortSelect");
    const scopeSelect = document.getElementById("scopeSelect");
    const selectedPlaylist = document.getElementById("selectedPlaylist");

    let currentSearch = searchInput.value;
    let currentScope = "spotify";

    function escapeRegExp(text) {
      return text.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function highlight(text, searchTerm) {
      if (!searchTerm) return text;
      const regex = new RegExp(`(${escapeRegExp(searchTerm)})`, "gi");
      return text.replace(regex, "<mark>$1</mark>");
    }

    function updateClearButton() {
      clearButton.style.display = searchInput.value.trim() ? "block" : "none";
    }

    function updateScopeDisplay() {
      selectedPlaylist.textContent = scopeNames[currentScope];
      scopeSelect.value = currentScope;
    }

    function getMatches() {
      const term = currentSearch.trim().toLowerCase();
      if (!term) return [];

      return songs.filter(song => {
        const inSelectedScope = song.scopes.includes(currentScope);
        const containsSearch =
          song.lyric.toLowerCase().includes(term) ||
          song.title.toLowerCase().includes(term) ||
          song.artist.toLowerCase().includes(term);

        return inSelectedScope && containsSearch;
      });
    }

    function sortMatches(matches) {
      if (sortSelect.value === "title") {
        return [...matches].sort((a, b) => a.title.localeCompare(b.title));
      }

      if (sortSelect.value === "artist") {
        return [...matches].sort((a, b) => a.artist.localeCompare(b.artist));
      }

      return matches;
    }

    function render() {
      const term = currentSearch.trim();
      const matches = sortMatches(getMatches());

      resultCount.textContent =
        `${matches.length} ${matches.length === 1 ? "song" : "songs"} found`;

      if (!term) {
        results.innerHTML = `
          <div class="empty">
            Type a word or phrase to search ${scopeNames[currentScope]}.
          </div>
        `;
        return;
      }

      if (matches.length === 0) {
        results.innerHTML = `
          <div class="empty">
            No songs found for “${term}” in ${scopeNames[currentScope]}.
          </div>
        `;
        return;
      }

      results.innerHTML = matches.map(song => `
        <article class="song-card">
          <div class="cover">${song.cover}</div>

          <div>
            <h3 class="song-title">${song.title}</h3>
            <p class="artist">${song.artist}</p>
          </div>

          <p class="lyric">${highlight(song.lyric, term)}</p>
          <span class="duration">${song.duration}</span>
          <button class="play-btn" type="button" aria-label="Play ${song.title}">▶</button>
        </article>
      `).join("");
    }

    function selectScope(scope) {
      currentScope = scope;
      updateScopeDisplay();
      render();
    }

    searchForm.addEventListener("submit", event => {
      event.preventDefault();
      currentSearch = searchInput.value;
      updateClearButton();
      render();
    });

    searchInput.addEventListener("input", updateClearButton);

    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      currentSearch = "";
      updateClearButton();
      render();
      searchInput.focus();
    });

    scopeSelect.addEventListener("change", () => {
      selectScope(scopeSelect.value);
    });

    sortSelect.addEventListener("change", render);

    updateClearButton();
    updateScopeDisplay();
    render();
  </script>
</body>
</html>
